<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{summary}}">
  
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- KaTeX for Math Equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}], throwOnError: false});"></script>

  <style>
    :root {
      --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --inline-code-bg: #e2e8f0;
      --inline-code-text: #0f172a;
      --quote-bg: #f8fafc;
      --quote-border: #3b82f6;
      --header-bg: rgba(248, 250, 252, 0.88);
      --drawer-bg: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #0b0f19;
        --bg-card: #131b2e;
        --bg-surface: #1e293b;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-light: #64748b;
        --border: #243049;
        --border-focus: #60a5fa;
        --primary: #38bdf8;
        --primary-hover: #7dd3fc;
        --primary-light: rgba(56, 189, 248, 0.12);
        --code-bg: #020617;
        --code-text: #f8fafc;
        --inline-code-bg: #243049;
        --inline-code-text: #38bdf8;
        --quote-bg: #141f36;
        --quote-border: #38bdf8;
        --header-bg: rgba(11, 15, 25, 0.88);
        --drawer-bg: #131b2e;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
      }
    }

    :root[data-theme="dark"] {
      --bg-page: #0b0f19;
      --bg-card: #131b2e;
      --bg-surface: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --border: #243049;
      --border-focus: #60a5fa;
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --primary-light: rgba(56, 189, 248, 0.12);
      --code-bg: #020617;
      --code-text: #f8fafc;
      --inline-code-bg: #243049;
      --inline-code-text: #38bdf8;
      --quote-bg: #141f36;
      --quote-border: #38bdf8;
      --header-bg: rgba(11, 15, 25, 0.88);
      --drawer-bg: #131b2e;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
    }

    :root[data-theme="light"] {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --inline-code-bg: #e2e8f0;
      --inline-code-text: #0f172a;
      --quote-bg: #f8fafc;
      --quote-border: #3b82f6;
      --header-bg: rgba(248, 250, 252, 0.88);
      --drawer-bg: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 75px;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.8;
      font-size: 16.5px;
      word-break: keep-all;
      overflow-wrap: break-word;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Sticky Header */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      min-width: 40px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .nav-btn:hover, .nav-btn:active {
      background: var(--bg-surface);
      border-color: var(--border);
    }

    .nav-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    @media (min-width: 640px) {
      .nav-title {
        max-width: 380px;
      }
    }

    .nav-title.visible {
      opacity: 1;
    }

    /* Reading Progress Bar */
    #progress-container {
      position: fixed;
      top: 57px;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      z-index: 50;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      transition: width 0.08s ease-out;
    }

    /* Main Container */
    .article-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      flex: 1;
    }

    @media (min-width: 768px) {
      .article-container {
        padding: 40px 24px 100px;
      }
    }

    /* Article Card Wrapper */
    .article-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 24px 18px;
    }

    @media (min-width: 768px) {
      .article-card {
        padding: 48px 48px;
      }
    }

    /* Article Header */
    .article-header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 500;
    }

    .article-title {
      font-size: clamp(24px, 5.5vw, 34px);
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .article-subtitle {
      font-size: clamp(16px, 3.8vw, 19px);
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .tag-pill {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      text-decoration: none;
    }

    /* Typography & Markdown Content */
    .content {
      color: var(--text-main);
    }

    .content h1, .content h2, .content h3, .content h4 {
      color: var(--text-main);
      font-weight: 750;
      line-height: 1.38;
      letter-spacing: -0.025em;
      margin-top: 2.2em;
      margin-bottom: 0.8em;
      position: relative;
    }

    .content h1 {
      font-size: clamp(21px, 4.8vw, 27px);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4em;
    }

    .content h2 {
      font-size: clamp(19px, 4.2vw, 23px);
      padding-left: 12px;
      border-left: 4px solid var(--primary);
    }

    .content h3 {
      font-size: clamp(17px, 3.6vw, 19.5px);
    }

    .content h4 {
      font-size: 16.5px;
      color: var(--text-muted);
    }

    .content p {
      margin-top: 0;
      margin-bottom: 1.4em;
      text-align: justify;
    }

    .content a {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 3px;
      word-break: break-all;
    }

    .content a:hover {
      color: var(--primary-hover);
    }

    .content strong, .content b {
      font-weight: 700;
    }

    .content ul, .content ol {
      margin-bottom: 1.4em;
      padding-left: 1.4em;
    }

    .content li {
      margin-bottom: 0.5em;
    }

    .content hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 2.5em 0;
    }

    .content blockquote {
      margin: 1.5em 0;
      padding: 14px 18px;
      background-color: var(--quote-bg);
      border-left: 4px solid var(--quote-border);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      color: var(--text-main);
    }

    .content blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Inline Code */
    .content code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--inline-code-bg);
      color: var(--inline-code-text);
      padding: 0.2em 0.45em;
      border-radius: 4px;
      font-weight: 500;
    }

    /* Code Block with Copy Button */
    .code-block-wrapper {
      position: relative;
      margin: 1.6em 0;
      border-radius: var(--radius-md);
      background: var(--code-bg);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      font-family: var(--font-mono);
      color: #94a3b8;
    }

    .code-lang {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .copy-btn.copied {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
    }

    .content pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      background: transparent;
      -webkit-overflow-scrolling: touch;
    }

    .content pre code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--code-text);
      display: block;
      background: none;
      padding: 0;
    }

    /* Tables (Responsive Scroll) */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 1.6em 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow-sm);
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px;
      text-align: left;
    }

    .content th {
      background: var(--bg-surface);
      font-weight: 700;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      white-space: nowrap;
    }

    .content td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    .content tr:last-child td {
      border-bottom: none;
    }

    .content tr:nth-child(even) td {
      background: rgba(0, 0, 0, 0.015);
    }

    /* TOC Drawer (Slide-in) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .toc-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      max-width: 85vw;
      height: 100%;
      background: var(--drawer-bg);
      border-left: 1px solid var(--border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      transition: right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toc-drawer.active {
      right: 0;
    }

    .toc-drawer-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .toc-drawer-title {
      font-size: 16px;
      font-weight: 700;
    }

    .toc-close-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    .toc-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 40px;
    }

    .toc-drawer-body ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-drawer-body li {
      margin-bottom: 8px;
    }

    .toc-drawer-body li.depth-2 { padding-left: 0; }
    .toc-drawer-body li.depth-3 { padding-left: 14px; }
    .toc-drawer-body li.depth-4 { padding-left: 24px; }

    .toc-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.45;
      display: block;
      padding: 4px 6px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }

    .toc-link:hover, .toc-link.active {
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }

    /* Floating Back to Top */
    #back-to-top {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.2s ease;
    }

    #back-to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* Footer */
    .article-footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-light);
      font-size: 13.5px;
    }

    .article-footer a {
      color: var(--text-muted);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="index.html" class="nav-btn" title="목록으로 이동">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>목록</span>
      </a>
      <span class="nav-title" id="nav-title-text">{{title}}</span>
    </div>
    
    <div class="nav-right">
      <button class="nav-btn" id="theme-toggle" aria-label="테마 전환" title="다크/라이트 모드 전환">
        <span id="theme-icon">🌓</span>
      </button>
      <button class="nav-btn" id="toc-toggle" aria-label="목차 열기" title="목차 보기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="3" y1="6" y2="6"/><line x1="15" x2="3" y1="12" y2="12"/><line x1="17" x2="3" y1="18" y2="18"/></svg>
        <span>목차</span>
      </button>
    </div>
  </header>

  <!-- Reading Progress Bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <!-- TOC Slide-in Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="toc-drawer" id="toc-drawer" aria-label="문서 목차">
    <div class="toc-drawer-header">
      <span class="toc-drawer-title">📑 목차</span>
      <button class="toc-close-btn" id="toc-close" aria-label="목차 닫기">&times;</button>
    </div>
    <div class="toc-drawer-body">
      {{toc_html}}
    </div>
  </aside>

  <!-- Main Article Content Container -->
  <main class="article-container">
    <article class="article-card">
      <header class="article-header">
        <div class="article-meta">
          <span class="meta-badge">📅 {{date}}</span>
          <span class="meta-badge">⏱️ 약 {{reading_time}}분</span>
          {{#author}}<span class="meta-badge">✍️ {{author}}</span>{{/author}}
        </div>
        <h1 class="article-title">{{title}}</h1>
        {{#subtitle}}<p class="article-subtitle">{{subtitle}}</p>{{/subtitle}}
        
        <div class="tag-list">
          {{#tags}}
          <span class="tag-pill">#{{.}}</span>
          {{/tags}}
        </div>
      </header>

      <section class="content" id="article-content">
        {{content}}
      </section>

      <footer class="article-footer">
        <p>© Curated Reading Hub · <a href="index.html">← 목록으로 돌아가기</a></p>
      </footer>
    </article>
  </main>

  <!-- Back to Top Button -->
  <button id="back-to-top" aria-label="맨 위로 가기" title="맨 위로 이동">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <script>
    // Theme Management
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    
    function getTheme() {
      const saved = localStorage.getItem('pages_theme');
      if (saved) return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('pages_theme', theme);
      if (themeIcon) {
        themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
      }
    }

    applyTheme(getTheme());

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || getTheme();
        const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });
    }

    // Reading Progress & Header Title Visibility
    const progressBar = document.getElementById('progress-bar');
    const navTitle = document.getElementById('nav-title-text');
    const backToTop = document.getElementById('back-to-top');

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      
      if (progressBar) progressBar.style.width = progress + '%';
      
      if (navTitle) {
        if (scrollTop > 140) {
          navTitle.classList.add('visible');
        } else {
          navTitle.classList.remove('visible');
        }
      }

      if (backToTop) {
        if (scrollTop > 300) {
          backToTop.classList.add('visible');
        } else {
          backToTop.classList.remove('visible');
        }
      }
    }, { passive: true });

    if (backToTop) {
      backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // TOC Drawer Interactions
    const tocToggle = document.getElementById('toc-toggle');
    const tocDrawer = document.getElementById('toc-drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const tocClose = document.getElementById('toc-close');

    function openDrawer() {
      if (tocDrawer) tocDrawer.classList.add('active');
      if (drawerOverlay) drawerOverlay.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      if (tocDrawer) tocDrawer.classList.remove('active');
      if (drawerOverlay) drawerOverlay.classList.remove('active');
      document.body.style.overflow = '';
    }

    if (tocToggle) tocToggle.addEventListener('click', openDrawer);
    if (tocClose) tocClose.addEventListener('click', closeDrawer);
    if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);

    document.querySelectorAll('.toc-link').forEach(link => {
      link.addEventListener('click', () => {
        closeDrawer();
      });
    });

    // Copy Code Buttons
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const code = btn.closest('.code-block-wrapper').querySelector('code').innerText;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ 복사됨';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = '복사';
            btn.classList.remove('copied');
          }, 2000);
        } catch (e) {
          btn.textContent = '실패';
        }
      });
    });
  </script>
</body>
</html>
