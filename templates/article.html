<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>{{title}}</title>
  <meta name="description" content="{{summary}}">
  
  <!-- Pretendard Web Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- Naver D2Coding -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/joungkyun/font-d2coding@1.3.2/d2coding.css" />
  <script>
    (function () {
      try {
        var f = localStorage.getItem("pages_font");
        if (f === "d2coding" || f === "pretendard") {
          document.documentElement.setAttribute("data-font", f);
        }
      } catch (e) {}
    })();
  </script>
  
  <!-- KaTeX for Math Equations -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '\\[', right: '\\]', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}], throwOnError: false});"></script>

  <style>
    :root {
      --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --inline-code-bg: #e2e8f0;
      --inline-code-text: #0f172a;
      --quote-bg: #f8fafc;
      --quote-border: #3b82f6;
      --header-bg: rgba(248, 250, 252, 0.88);
      --drawer-bg: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;
    }

    :root[data-font="d2coding"] {
      --font-sans: "D2 coding", "D2Coding", Pretendard, monospace;
      --font-mono: "D2 coding", "D2Coding", ui-monospace, monospace;
    }


    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-page: #0b0f19;
        --bg-card: #131b2e;
        --bg-surface: #1e293b;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --text-light: #64748b;
        --border: #243049;
        --border-focus: #60a5fa;
        --primary: #38bdf8;
        --primary-hover: #7dd3fc;
        --primary-light: rgba(56, 189, 248, 0.12);
        --code-bg: #020617;
        --code-text: #f8fafc;
        --inline-code-bg: #243049;
        --inline-code-text: #38bdf8;
        --quote-bg: #141f36;
        --quote-border: #38bdf8;
        --header-bg: rgba(11, 15, 25, 0.88);
        --drawer-bg: #131b2e;
        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
      }
    }

    :root[data-theme="dark"] {
      --bg-page: #0b0f19;
      --bg-card: #131b2e;
      --bg-surface: #1e293b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --border: #243049;
      --border-focus: #60a5fa;
      --primary: #38bdf8;
      --primary-hover: #7dd3fc;
      --primary-light: rgba(56, 189, 248, 0.12);
      --code-bg: #020617;
      --code-text: #f8fafc;
      --inline-code-bg: #243049;
      --inline-code-text: #38bdf8;
      --quote-bg: #141f36;
      --quote-border: #38bdf8;
      --header-bg: rgba(11, 15, 25, 0.88);
      --drawer-bg: #131b2e;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
    }

    :root[data-theme="light"] {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --bg-surface: #f1f5f9;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border: #e2e8f0;
      --border-focus: #3b82f6;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --code-bg: #0f172a;
      --code-text: #e2e8f0;
      --inline-code-bg: #e2e8f0;
      --inline-code-text: #0f172a;
      --quote-bg: #f8fafc;
      --quote-border: #3b82f6;
      --header-bg: rgba(248, 250, 252, 0.88);
      --drawer-bg: #ffffff;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 75px;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.8;
      font-size: 16.5px;
      word-break: keep-all;
      overflow-wrap: break-word;
      transition: background-color 0.25s ease, color 0.25s ease;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Sticky Header */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 40;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border);
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 40px;
      min-width: 40px;
      padding: 0 10px;
      border-radius: var(--radius-md);
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.18s ease;
    }

    .nav-btn:hover, .nav-btn:active {
      background: var(--bg-surface);
      border-color: var(--border);
    }

    .font-picker {
      position: relative;
    }

    .font-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 156px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 4px;
      z-index: 60;
    }

    .font-menu[hidden] {
      display: none;
    }

    .font-option {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .font-option:hover,
    .font-option:focus-visible {
      background: var(--bg-surface);
      outline: none;
    }

    .font-option[aria-selected="true"] {
      background: var(--primary-light);
      color: var(--primary);
    }

    .font-option[data-font="pretendard"] {
      font-family: Pretendard, sans-serif;
    }

    .font-option[data-font="d2coding"] {
      font-family: "D2 coding", "D2Coding", monospace;
    }

    .nav-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    @media (min-width: 640px) {
      .nav-title {
        max-width: 380px;
      }
    }

    .nav-title.visible {
      opacity: 1;
    }

    /* Reading Progress Bar */
    #progress-container {
      position: fixed;
      top: 57px;
      left: 0;
      width: 100%;
      height: 3px;
      background: transparent;
      z-index: 50;
    }

    #progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
      transition: width 0.08s ease-out;
    }

    /* Main Container */
    .article-container {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      flex: 1;
    }

    @media (min-width: 768px) {
      .article-container {
        padding: 40px 24px 100px;
      }
    }

    /* Article Card Wrapper */
    .article-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      padding: 24px 18px;
    }

    @media (min-width: 768px) {
      .article-card {
        padding: 48px 48px;
      }
    }

    /* Article Header */
    .article-header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .article-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13.5px;
      color: var(--text-muted);
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-weight: 500;
    }

    .article-title {
      font-size: clamp(24px, 5.5vw, 34px);
      font-weight: 800;
      line-height: 1.32;
      letter-spacing: -0.03em;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .article-subtitle {
      font-size: clamp(16px, 3.8vw, 19px);
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 14px;
    }

    .tag-pill {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--primary);
      background: var(--primary-light);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      text-decoration: none;
    }

    /* Typography & Markdown Content */
    .content {
      color: var(--text-main);
    }

    .content h1, .content h2, .content h3, .content h4 {
      color: var(--text-main);
      font-weight: 750;
      line-height: 1.38;
      letter-spacing: -0.025em;
      margin-top: 2.2em;
      margin-bottom: 0.8em;
      position: relative;
    }

    .content h1 {
      font-size: clamp(21px, 4.8vw, 27px);
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.4em;
    }

    .content h2 {
      font-size: clamp(19px, 4.2vw, 23px);
      padding-left: 12px;
      border-left: 4px solid var(--primary);
    }

    .content h3 {
      font-size: clamp(17px, 3.6vw, 19.5px);
    }

    .content h4 {
      font-size: 16.5px;
      color: var(--text-muted);
    }

    .content a.heading-anchor {
      color: var(--text-light);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.82em;
      margin-right: 0.35em;
      opacity: 0;
      transition: opacity 0.15s ease;
      word-break: keep-all;
    }
    .content h1:hover > a.heading-anchor,
    .content h2:hover > a.heading-anchor,
    .content h3:hover > a.heading-anchor,
    .content h4:hover > a.heading-anchor,
    .content a.heading-anchor:focus,
    .content a.heading-anchor:focus-visible {
      opacity: 1;
      color: var(--text-muted);
    }

    .content p {
      margin-top: 0;
      margin-bottom: 1.4em;
      text-align: start;
    }

    .content a {
      color: var(--primary);
      text-decoration: underline;
      text-underline-offset: 3px;
      word-break: break-all;
    }

    .content a:hover {
      color: var(--primary-hover);
    }

    .content strong, .content b {
      font-weight: 700;
    }

    .content ul, .content ol {
      margin-bottom: 1.4em;
      padding-left: 1.4em;
    }

    .content li {
      margin-bottom: 0.5em;
    }

    .content hr {
      border: 0;
      height: 1px;
      background: var(--border);
      margin: 2.5em 0;
    }

    .content blockquote {
      margin: 1.5em 0;
      padding: 14px 18px;
      background-color: var(--quote-bg);
      border-left: 4px solid var(--quote-border);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      color: var(--text-main);
    }

    .content blockquote p:last-child {
      margin-bottom: 0;
    }

    /* Inline Code */
    .content code:not(pre code) {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: var(--inline-code-bg);
      color: var(--inline-code-text);
      padding: 0.2em 0.45em;
      border-radius: 4px;
      font-weight: 500;
    }

    /* Code Block with Copy Button */
    .code-block-wrapper {
      position: relative;
      margin: 1.6em 0;
      border-radius: var(--radius-md);
      background: var(--code-bg);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 12px;
      font-family: var(--font-mono);
      color: #94a3b8;
    }

    .code-lang {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .code-lang.lang-generic {
      text-transform: none;
      letter-spacing: 0;
    }

    .copy-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      font-size: 11.5px;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }
    .nav-btn:focus-visible,
    .sim-btn:focus-visible,
    .sim-tab-btn:focus-visible,
    .copy-btn:focus-visible,
    .toc-close-btn:focus-visible,
    #back-to-top:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    .copy-btn.copied {
      background: #10b981;
      color: #ffffff;
      border-color: #10b981;
    }

    .content pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      background: transparent;
      -webkit-overflow-scrolling: touch;
    }

    .content pre code {
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--code-text);
      display: block;
      background: none;
      padding: 0;
    }

    /* Tables (Responsive Scroll) */
    /* Callout & Note Blocks */
    .callout-box {
      margin: 1.6em 0;
      padding: 16px 18px;
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      border-left: 4px solid var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .callout-box.tip {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.08);
    }

    .callout-box.warning {
      border-left-color: #f59e0b;
      background: rgba(245, 158, 11, 0.08);
    }

    .callout-box.info {
      border-left-color: #3b82f6;
      background: rgba(59, 130, 246, 0.08);
    }

    .callout-title {
      font-weight: 700;
      font-size: 15px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Interactive Simulator Component */
    .sim-container {
      margin: 2em 0;
      padding: 20px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
    }

    .sim-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .sim-title {
      font-size: 17px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-main);
    }

    .sim-tabs {
      display: flex;
      gap: 6px;
      background: var(--bg-card);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .sim-tab-btn {
      padding: 6px 12px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .sim-tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .sim-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
      background: var(--bg-card);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .sim-btn-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .sim-btn {
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
      flex: 0 0 auto;
    }

    @media (max-width: 420px) {
      .sim-controls {
        flex-direction: column;
        align-items: stretch;
      }
      .sim-btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: 100%;
      }
      .sim-btn {
        justify-content: center;
      }
    }

    .sim-btn:hover:not(:disabled) {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    .sim-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .sim-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .sim-btn.primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .sim-status-badge {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: var(--radius-full);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .sim-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 16px;
    }

    @media (min-width: 640px) {
      .sim-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .sim-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
    }

    .sim-panel-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sim-registers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .sim-reg-card {
      background: var(--bg-surface);
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      transition: all 0.2s ease;
    }

    .sim-reg-card.changed {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      animation: pulse-orange 0.8s ease;
    }

    .sim-reg-label {
      font-size: 11.5px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 2px;
    }

    .sim-reg-val {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
    }

    .sim-mem-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sim-mem-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-size: 13px;
      font-family: var(--font-mono);
      transition: all 0.2s ease;
    }

    .sim-mem-row.pc-target {
      border-color: var(--primary);
      background: var(--primary-light);
      font-weight: 700;
    }

    .sim-mem-row.modified {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.1);
      font-weight: 700;
      animation: pulse-red 0.8s ease;
    }

    .sim-mem-row.read-target {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.1);
      font-weight: 700;
    }

    .sim-badge-sm {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: var(--radius-full);
      font-family: var(--font-sans);
      font-weight: 600;
    }

    .badge-code { background: #3b82f6; color: white; }
    .badge-data { background: #10b981; color: white; }
    .badge-mod { background: #ef4444; color: white; }

    .sim-desc-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }

    .sim-desc-step {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-main);
    }

    .sim-desc-step strong {
      color: var(--primary);
    }

    @keyframes pulse-orange {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @keyframes pulse-red {
      0% { transform: scale(1); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .sim-reg-card.changed,
      .sim-mem-row.modified {
        animation: none;
      }
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 1.6em 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      -webkit-overflow-scrolling: touch;
      box-shadow: var(--shadow-sm);
    }

    .content table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px;
      text-align: left;
    }

    .content th {
      background: var(--bg-surface);
      font-weight: 700;
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
      white-space: nowrap;
    }

    .content td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-main);
    }

    .content tr:last-child td {
      border-bottom: none;
    }

    .content tr:nth-child(even) td {
      background: rgba(0, 0, 0, 0.015);
    }

    /* TOC Drawer (Slide-in) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .drawer-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .toc-drawer {
      position: fixed;
      top: 0;
      right: -320px;
      width: 300px;
      max-width: 85vw;
      height: 100%;
      background: var(--drawer-bg);
      border-left: 1px solid var(--border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-lg);
      transition: right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toc-drawer.active {
      right: 0;
    }

    .toc-drawer-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .toc-drawer-title {
      font-size: 16px;
      font-weight: 700;
    }

    .toc-close-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
    }

    .toc-drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 40px;
    }

    .toc-drawer-body ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .toc-drawer-body li {
      margin-bottom: 8px;
    }

    .toc-drawer-body li.depth-2 { padding-left: 0; }
    .toc-drawer-body li.depth-3 { padding-left: 14px; }
    .toc-drawer-body li.depth-4 { padding-left: 24px; }

    .toc-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
      line-height: 1.45;
      display: block;
      padding: 4px 6px;
      border-radius: var(--radius-sm);
      transition: all 0.15s ease;
    }

    .toc-link:hover, .toc-link.active {
      color: var(--primary);
      background: var(--primary-light);
      font-weight: 600;
    }

    /* Floating Back to Top */
    #back-to-top {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: var(--radius-full);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      z-index: 30;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.2s ease;
    }

    #back-to-top.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    /* Footer */
    .article-footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--text-light);
      font-size: 13.5px;
    }

    .article-footer a {
      color: var(--text-muted);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="index.html" class="nav-btn" title="목록으로 이동">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        <span>목록</span>
      </a>
      <span class="nav-title" id="nav-title-text">{{title}}</span>
    </div>
    
    <div class="nav-right">
      <div class="font-picker" id="font-picker">
        <button class="nav-btn" id="font-toggle" type="button" aria-label="본문 폰트" title="본문 폰트 선택" aria-expanded="false" aria-haspopup="listbox" aria-controls="font-menu">가</button>
        <div class="font-menu" id="font-menu" role="listbox" hidden>
          <button type="button" class="font-option" role="option" data-font="pretendard" aria-selected="true">Pretendard</button>
          <button type="button" class="font-option" role="option" data-font="d2coding" aria-selected="false">D2Coding</button>
        </div>
      </div>
      <button class="nav-btn" id="theme-toggle" aria-label="테마 전환" title="다크/라이트 모드 전환">
        <span id="theme-icon">🌓</span>
      </button>
      <button class="nav-btn" id="toc-toggle" aria-label="목차 열기" title="목차 보기" aria-expanded="false" aria-controls="toc-drawer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="3" y1="6" y2="6"/><line x1="15" x2="3" y1="12" y2="12"/><line x1="17" x2="3" y1="18" y2="18"/></svg>
        <span>목차</span>
      </button>
    </div>
  </header>

  <!-- Reading Progress Bar -->
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <!-- TOC Slide-in Drawer -->
  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="toc-drawer" id="toc-drawer" aria-label="문서 목차">
    <div class="toc-drawer-header">
      <span class="toc-drawer-title">📑 목차</span>
      <button class="toc-close-btn" id="toc-close" aria-label="목차 닫기">&times;</button>
    </div>
    <div class="toc-drawer-body">
      {{toc_html}}
    </div>
  </aside>

  <!-- Main Article Content Container -->
  <main class="article-container">
    <article class="article-card">
      <header class="article-header">
        <div class="article-meta">
          <span class="meta-badge">📅 {{date}}</span>
          <span class="meta-badge">⏱️ 약 {{reading_time}}분</span>
          {{#author}}<span class="meta-badge">✍️ {{author}}</span>{{/author}}
        </div>
        <h1 class="article-title">{{title}}</h1>
        {{#subtitle}}<p class="article-subtitle">{{subtitle}}</p>{{/subtitle}}
        
        <div class="tag-list">
          {{#tags}}
          <span class="tag-pill">#{{.}}</span>
          {{/tags}}
        </div>
      </header>

      <section class="content" id="article-content">
        {{content}}
      </section>

      <footer class="article-footer">
        <p>© Curated Reading Hub · <a href="index.html">← 목록으로 돌아가기</a></p>
      </footer>
    </article>
  </main>

  <!-- Back to Top Button -->
  <button id="back-to-top" aria-label="맨 위로 가기" title="맨 위로 이동">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
  </button>

  <script>
    // Theme Management
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    
    function getTheme() {
      const saved = localStorage.getItem('pages_theme');
      if (saved) return saved;
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem('pages_theme', theme);
      if (themeIcon) {
        themeIcon.textContent = theme === 'dark' ? '🌙' : '☀️';
      }
    }

    applyTheme(getTheme());

    const FONT_KEY = "pages_font";
    const fontToggle = document.getElementById("font-toggle");
    const fontMenu = document.getElementById("font-menu");
    const fontOptions = fontMenu ? fontMenu.querySelectorAll(".font-option") : [];

    function getFont() {
      try {
        const saved = localStorage.getItem(FONT_KEY);
        if (saved === "d2coding" || saved === "pretendard") return saved;
      } catch (e) {}
      return "pretendard";
    }

    function applyFont(font) {
      document.documentElement.setAttribute("data-font", font);
      try { localStorage.setItem(FONT_KEY, font); } catch (e) {}
      fontOptions.forEach((btn) => {
        btn.setAttribute("aria-selected", btn.dataset.font === font ? "true" : "false");
      });
    }

    function closeFontMenu() {
      if (!fontMenu || !fontToggle) return;
      fontMenu.hidden = true;
      fontToggle.setAttribute("aria-expanded", "false");
    }

    function toggleFontMenu() {
      if (!fontMenu || !fontToggle) return;
      const open = fontMenu.hidden;
      fontMenu.hidden = !open;
      fontToggle.setAttribute("aria-expanded", open ? "true" : "false");
    }

    applyFont(getFont());

    if (fontToggle) {
      fontToggle.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFontMenu();
      });
    }
    fontOptions.forEach((btn) => {
      btn.addEventListener("click", () => {
        applyFont(btn.dataset.font);
        closeFontMenu();
      });
    });
    document.addEventListener("click", (e) => {
      if (fontMenu && !fontMenu.hidden && !e.target.closest("#font-picker")) {
        closeFontMenu();
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeFontMenu();
    });

    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') || getTheme();
        const next = current === 'dark' ? 'light' : 'dark';
        applyTheme(next);
      });
    }

    // Reading Progress & Header Title Visibility
    const progressBar = document.getElementById('progress-bar');
    const navTitle = document.getElementById('nav-title-text');
    const backToTop = document.getElementById('back-to-top');

    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      
      if (progressBar) progressBar.style.width = progress + '%';
      
      if (navTitle) {
        if (scrollTop > 140) {
          navTitle.classList.add('visible');
        } else {
          navTitle.classList.remove('visible');
        }
      }

      if (backToTop) {
        if (scrollTop > 300) {
          backToTop.classList.add('visible');
        } else {
          backToTop.classList.remove('visible');
        }
      }
    }, { passive: true });

    if (backToTop) {
      backToTop.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // TOC Drawer Interactions
    const tocToggle = document.getElementById('toc-toggle');
    const tocDrawer = document.getElementById('toc-drawer');
    const drawerOverlay = document.getElementById('drawer-overlay');
    const tocClose = document.getElementById('toc-close');

    function openDrawer() {
      if (tocDrawer) tocDrawer.classList.add('active');
      if (drawerOverlay) drawerOverlay.classList.add('active');
      if (tocToggle) tocToggle.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      if (tocDrawer) tocDrawer.classList.remove('active');
      if (drawerOverlay) drawerOverlay.classList.remove('active');
      if (tocToggle) tocToggle.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    if (tocToggle) tocToggle.addEventListener('click', openDrawer);
    if (tocClose) tocClose.addEventListener('click', closeDrawer);
    if (drawerOverlay) drawerOverlay.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });

    document.querySelectorAll('.toc-link').forEach(link => {
      link.addEventListener('click', () => {
        closeDrawer();
      });
    });

    // Copy Code Buttons
    document.querySelectorAll('.copy-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const code = btn.closest('.code-block-wrapper').querySelector('code').innerText;
        try {
          await navigator.clipboard.writeText(code);
          btn.textContent = '✓ 복사됨';
          btn.classList.add('copied');
          setTimeout(() => {
            btn.textContent = '복사';
            btn.classList.remove('copied');
          }, 2000);
        } catch (e) {
          btn.textContent = '실패';
        }
      });
    });

    // ==========================================
    // Interactive Memory & Step Simulator Logic
    // ==========================================
    function initSimulator() {
      const simContainer = document.getElementById('interactive-simulator');
      if (!simContainer) return;

      const smcSteps = [
        {
          beat: 0, pc: 6, nextPc: 6,
          action: "실행 전",
          sum: "0", memo: "-", cmd6: "add [20]",

        },
        {
          beat: 1, pc: 6, nextPc: 7,

        },
        {

          highlightRow: "mem-21", pcRow: "mem-6", modRow: null
        },
        {
          beat: 5, pc: 7, nextPc: 8,
          action: "6호 명령의 주소 필드를 21에서 22로 수정",
          sum: "10", memo: "-", cmd6: "add [22]",
          desc: "<strong>[박자 5]</strong> 7호 명령이 다시 6호 레시피를 수정합니다. 명령 속 '21'이 '22'로 변합니다. (6호 명령: <strong style='color:#ef4444;'>add [22]</strong>)",
          highlightRow: null, pcRow: "mem-7", modRow: "mem-6"
        },
        {
          beat: 6, pc: 8, nextPc: 9,
          action: "주소칸(22) == 22 이므로 루프 종료",
          sum: "10", memo: "-", cmd6: "add [22]",
          desc: "<strong>[박자 6]</strong> 주소칸이 22와 일치하므로 루프를 통과합니다. <strong>최종 합계: 10</strong>. 단, 끝난 뒤에도 6호 레시피는 원본과 다른 <code>add [22]</code>로 영구 변질되었습니다.",
          highlightRow: null, pcRow: "mem-8", modRow: null
        }
      ];

      const ptrSteps = [
        {
          beat: 0, pc: 6, nextPc: 6,
          action: "실행 전",
          sum: "0", memo: "20", cmd6: "add [4], [[3]]",
          desc: "<strong>[실행 전]</strong> 아직 아무 명령도 실행하지 않았다. PC는 첫 명령인 6호를 가리키고, 합계는 0, 메모지는 20호다.",
          highlightRow: null, pcRow: "mem-6", modRow: null
        },
        {
          beat: 1, pc: 6, nextPc: 7,
          action: "3호 메모지(20)가 가리키는 20호의 값(7)을 더함",
          sum: "7", memo: "20", cmd6: "add [4], [[3]]",
          desc: "<strong>[박자 1]</strong> PC가 6을 가리킵니다. 명령 <code>add [4], [[3]]</code>은 3호 메모지(20호)를 보고 20호의 재료(7)를 합계에 더합니다. <strong>(명령어는 고정!)</strong>",
          highlightRow: "mem-20", pcRow: "mem-6", modRow: null
        },
        {
          beat: 2, pc: 7, nextPc: 8,
          action: "3호 메모지의 숫자를 20에서 21로 증가",
          sum: "7", memo: "21", cmd6: "add [4], [[3]]",
          desc: "<strong>[박자 2]</strong> 7호 명령이 <strong>3호 메모지의 숫자만 20에서 21로 변경</strong>합니다. 6호 레시피는 전혀 건드리지 않습니다. (메모지: 20 → <strong style='color:#10b981;'>21</strong>)",
          highlightRow: null, pcRow: "mem-7", modRow: "mem-3"
        },
        {
          beat: 3, pc: 8, nextPc: 6,
          action: "메모지(21) ≠ 22 이므로 주소 6으로 점프",
          sum: "7", memo: "21", cmd6: "add [4], [[3]]",
          desc: "<strong>[박자 3]</strong> 8호 명령이 메모지의 숫자(21)를 22와 비교합니다. 일치하지 않으므로 <strong>PC를 6으로 점프</strong>시킵니다.",
          highlightRow: null, pcRow: "mem-8", modRow: null
        },
        {
          beat: 4, pc: 6, nextPc: 7,
          action: "3호 메모지(21)가 가리키는 21호의 값(3)을 더함",
          sum: "10", memo: "21", cmd6: "add [4], [[3]]",
          desc: "<strong>[박자 4]</strong> 다시 주소 6으로 왔습니다. 명령 글자는 여전히 똑같은 <code>add [4], [[3]]</code>이지만, 손에 든 메모지가 21호이므로 21호의 3을 더합니다. (합계: 7 → <strong>10</strong>)",
          highlightRow: "mem-21", pcRow: "mem-6", modRow: null
        },
        {
          beat: 5, pc: 7, nextPc: 8,
          action: "3호 메모지의 숫자를 21에서 22로 증가",
          sum: "10", memo: "22", cmd6: "add [4], [[3]]",
          desc: "<strong>[박자 5]</strong> 7호 명령이 3호 메모지 숫자를 21에서 22로 올립니다. 레시피 6호는 여전히 깨끗합니다. (메모지: 21 → <strong style='color:#10b981;'>22</strong>)",
          highlightRow: null, pcRow: "mem-7", modRow: "mem-3"
        },
        {
          beat: 6, pc: 8, nextPc: 9,
          action: "메모지(22) == 22 이므로 루프 종료",
          sum: "10", memo: "22", cmd6: "add [4], [[3]]",
          desc: "<strong>[박자 6]</strong> 메모지가 22에 도달하여 루프를 마칩니다. <strong>최종 합계: 10</strong>. 6호 레시피는 원본 그대로 완벽하게 보존되었습니다.",
          highlightRow: null, pcRow: "mem-8", modRow: null
        }
      ];

      let currentMode = 'smc'; // 'smc' or 'ptr'
      let currentStep = 0;
      let autoPlayTimer = null;

      const tabSmc = document.getElementById('sim-tab-smc');
      const tabPtr = document.getElementById('sim-tab-ptr');
      const btnPrev = document.getElementById('sim-prev');
      const btnNext = document.getElementById('sim-next');
      const btnReset = document.getElementById('sim-reset');
      const btnPlay = document.getElementById('sim-play');

      const elBeat = document.getElementById('sim-val-beat');
      const elPc = document.getElementById('sim-val-pc');
      const elNextPc = document.getElementById('sim-val-nextpc');
      const elAction = document.getElementById('sim-val-action');
      const elSum = document.getElementById('sim-val-sum') || document.getElementById('sim-mem-4-val');
      const elMemo = document.getElementById('sim-val-memo') || document.getElementById('sim-mem-3-val');
      const elCmd6 = document.getElementById('sim-val-cmd6') || document.getElementById('sim-mem-6-val');
      const elDesc = document.getElementById('sim-val-desc');

      function setText(el, value) {
        if (el) el.textContent = value;
      }
      function setHtml(el, value) {
        if (el) el.innerHTML = value;
      }
      function lastBeat(steps) {
        return steps.length ? steps[steps.length - 1].beat : 0;
      }

      function updateUI() {
        const steps = currentMode === 'smc' ? smcSteps : ptrSteps;
        const data = steps[currentStep];
        if (!data) return;

        setText(elBeat, `박자 ${data.beat} / ${lastBeat(steps)}`);
        setText(elPc, `${data.pc}호`);
        setText(elNextPc, `${data.nextPc}호`);
        setText(elAction, data.action);
        setText(elSum, data.sum);
        setText(elMemo, data.memo);
        setText(elCmd6, data.cmd6);
        setHtml(elDesc, data.desc);

        if (btnPrev) btnPrev.disabled = currentStep === 0;
        if (btnNext) btnNext.disabled = currentStep === steps.length - 1;

        document.querySelectorAll('.sim-mem-row').forEach(row => {
          row.classList.remove('pc-target', 'modified', 'read-target');
        });

        if (data.pcRow) {
          const r = document.getElementById(data.pcRow);
          if (r) r.classList.add('pc-target');
        }
        if (data.highlightRow) {
          const r = document.getElementById(data.highlightRow);
          if (r) r.classList.add('read-target');
        }
        if (data.modRow) {
          const r = document.getElementById(data.modRow);
          if (r) r.classList.add('modified');
        }

        const row6Val = document.getElementById('sim-mem-6-val');
        if (row6Val) row6Val.textContent = data.cmd6;
        const row3Val = document.getElementById('sim-mem-3-val');
        if (row3Val) row3Val.textContent = data.memo;
        const row4Val = document.getElementById('sim-mem-4-val');
        if (row4Val) row4Val.textContent = data.sum;
      }

      function stopAutoPlay() {
        if (autoPlayTimer) {
          clearInterval(autoPlayTimer);
          autoPlayTimer = null;
          if (btnPlay) btnPlay.textContent = '▶ 자동 재생';
        }
      }

      function startAutoPlay() {
        if (btnPlay) btnPlay.textContent = '⏸ 일시 정지';
        autoPlayTimer = setInterval(() => {
          const steps = currentMode === 'smc' ? smcSteps : ptrSteps;
          if (currentStep < steps.length - 1) {
            currentStep++;
            updateUI();
          } else {
            stopAutoPlay();
          }
        }, 1600);
      }

      function applyModeChrome(mode) {
        currentMode = mode;
        if (tabSmc) {
          tabSmc.classList.toggle('active', mode === 'smc');
          tabSmc.setAttribute('aria-selected', mode === 'smc' ? 'true' : 'false');
        }
        if (tabPtr) {
          tabPtr.classList.toggle('active', mode === 'ptr');
          tabPtr.setAttribute('aria-selected', mode === 'ptr' ? 'true' : 'false');
        }
        const memoRow = document.getElementById('mem-3');
        if (memoRow) memoRow.style.opacity = mode === 'smc' ? '0.4' : '1';
      }

      if (tabSmc) {
        tabSmc.addEventListener('click', () => {
          if (currentMode === 'smc') return;
          stopAutoPlay();
          applyModeChrome('smc');
          currentStep = 0;
          updateUI();
        });
      }

      if (tabPtr) {
        tabPtr.addEventListener('click', () => {
          if (currentMode === 'ptr') return;
          stopAutoPlay();
          applyModeChrome('ptr');
          currentStep = 0;
          updateUI();
        });
      }

      if (btnPrev) {
        btnPrev.addEventListener('click', () => {
          stopAutoPlay();
          if (currentStep > 0) {
            currentStep--;
            updateUI();
          }
        });
      }

      if (btnNext) {
        btnNext.addEventListener('click', () => {
          stopAutoPlay();
          const steps = currentMode === 'smc' ? smcSteps : ptrSteps;
          if (currentStep < steps.length - 1) {
            currentStep++;
            updateUI();
          }
        });
      }

      if (btnReset) {
        btnReset.addEventListener('click', () => {
          stopAutoPlay();
          currentStep = 0;
          updateUI();
        });
      }

      if (btnPlay) {
        btnPlay.addEventListener('click', () => {
          if (autoPlayTimer) {
            stopAutoPlay();
          } else {
            const steps = currentMode === 'smc' ? smcSteps : ptrSteps;
            if (currentStep >= steps.length - 1) currentStep = 0;
            updateUI();
            startAutoPlay();
          }
        });
      }

      // Initial state: beat 0 idle
      applyModeChrome('smc');
      currentStep = 0;
      updateUI();
    }

    // Initialize on DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSimulator);
    } else {
      initSimulator();
    }
  </script>
</body>
</html>
